function copyPrompt(fieldId,statusId){
  const field=document.getElementById(fieldId);
  const status=document.getElementById(statusId);

  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(field.value)
    .then(()=>status.textContent="✓ Prompt copied successfully!")
    .catch(()=>fallbackCopy(field,status));
  }else{
    fallbackCopy(field,status);
  }
}

function fallbackCopy(field,status){
  field.focus();
  field.select();
  field.setSelectionRange(0,field.value.length);
  status.textContent=document.execCommand("copy")
    ?"✓ Prompt copied successfully!"
    :"লেখাটি সিলেক্ট করে Copy করো।";
}
